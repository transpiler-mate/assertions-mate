version: '3'

includes:
  quality: https://raw.githubusercontent.com/Terradue/taskfile-utils/refs/heads/main/quality.yaml

tasks:

  default:
    cmds:
    - task: quality:pre-commit:run

  examples:
    desc: "Run every example"
    cmds:
      - |
        uv run --no-project --with transpiler-mate-runtime --with-editable . bash -c '
          set -euo pipefail
          status=0

          for example_dir in examples/*/; do
            workflow="${example_dir}workflow.cwl"

            if [ -f "${workflow}" ]; then
              for inputs in "${example_dir}"inputs-*.yaml; do
                echo "Running ${workflow} with ${inputs}"
                if ! transpiler-mate assertions-mate --inputs "${inputs}" "${workflow}"; then
                  status=1
                fi
              done
            fi

            for test_file in "${example_dir}"test_*.py; do
              if [ -f "${test_file}" ]; then
                echo "Running ${test_file}"
                if ! hatch run test:pytest -q "${test_file}"; then
                  status=1
                fi
              fi
            done
          done

          exit "${status}"
        '

  generate_schema_doc:
    cmds:
    - |
      uv run \
      --no-cache \
      --no-project \
      --with schema-salad \
      schema-salad-doc \
      --only 'http://oeap.github.io/schema#JSONSchemaHint' \
      --only 'http://oeap.github.io/schema#RegoPolicyHint' \
      --only 'http://oeap.github.io/schema#Cql2Query' \
      --only 'http://oeap.github.io/schema#Cql2FilterHint' \
      ./schemas/hints.yaml > ./docs/reference/hints_schema.html

  docs:serve:
    desc: "Serve MkDocs site using hatch docs environment"
    cmds:
      - |
        set -euo pipefail
        HATCH_DATA_DIR="$PWD/.task/hatch" hatch run docs:serve
