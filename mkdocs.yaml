site_name: Assertions Mate
site_url: https://Transpiler-Mate.github.io/assertions-mate/
site_author: Fabrice Brito, Simone Tripodi
repo_url: https://github.com/Transpiler-Mate/assertions-mate/
repo_name: Transpiler-Mate/assertions-mate

theme:
  logo: imgs/icon-eoap.png
  name: readthedocs

  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode

plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths: [src]
- mermaid2:
    version: 11.4.1
- mkdocs-jupyter:
    execute: true
    show_input: True
    no_input: False
- build_plantuml:
    render: 'server' # or "local" for local rendering
    server: 'https://uml.planttext.com/plantuml' 
    disable_ssl_certificate_validation: true # for self-signed and invalid certs
    output_format: 'png'
    allow_multiple_roots: false # in case your codebase contains more locations for diagrams (all ending in diagram_root)
    diagram_root: 'docs/diagrams' # should reside under docs_dir
    input_folder: 'src'
    output_folder: 'out'
    theme_enabled: true
    theme_folder: "include/themes"
    theme_light: "light.puml"
    theme_dark: "dark.puml"

markdown_extensions:
- pymdownx.details
- abbr
- admonition
- footnotes
- pymdownx.caret
- pymdownx.mark
- pymdownx.tilde
- pymdownx.arithmatex:
    generic: true
- pymdownx.superfences
- pymdownx.tabbed
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_div_format
- attr_list
- pymdownx.snippets:
    base_path: './'
- pymdownx.highlight:
    line_spans: __span

extra_css:
- styles/css/app.css
  
extra_javascript:
- javascripts/config.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

